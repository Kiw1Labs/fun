<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Sabe Essa? Desafios para jogar ao vivo com a sua turma.">
  <title>Fun · Sabe Essa?</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script type="module" src="/assets/app.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>
  <header class="mobile"><button id="menu" class="icon-button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir navegação"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h12M4 18h16"/></svg></button><a href="/" class="brand" aria-label="Fun, início"><img src="/brand/fun-logo.png" alt=""><span>fun<span class="dot">.</span></span></a></header>
  <button id="menu-backdrop" tabindex="-1" aria-label="Fechar navegação" hidden></button>
  <aside id="sidebar" aria-label="Navegação">
    <div class="sidebar-header"><a class="brand" href="/" aria-label="Fun, início"><img src="/brand/fun-logo.png" alt=""><span>fun<span class="dot">.</span></span></a><button id="sidebar-toggle" class="icon-button" aria-label="Recolher navegação" aria-controls="sidebar" aria-expanded="true" title="Recolher navegação"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button></div>
    <nav class="sidebar-body" aria-label="Principal">
      <button class="nav-item" id="portal-nav" aria-label="Início" title="Início" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span class="nav-label">Início</span></button>
      <button class="nav-item" id="credits-open" aria-label="Créditos" title="Créditos"><span aria-hidden="true">ⓘ</span><span class="nav-label">Créditos</span></button>
      <span class="nav-heading">Jogos</span>
      <button class="nav-item" id="game-nav" aria-label="Sabe Essa?" title="Sabe Essa?"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M9.5 9a2.5 2.5 0 1 1 4 2c-1.5 1-1.5 1-1.5 2M12 16h.01"/></svg><span class="nav-label">Sabe Essa?</span></button>
    </nav>
    <div class="sidebar-footer"><button id="theme" class="nav-item" aria-label="Alternar tema" title="Alternar tema"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg><span class="nav-label">Tema <span id="theme-label">escuro</span></span></button><small>Feito para jogar junto.</small></div>
  </aside>
  <main id="main" tabindex="-1"></main>
  <dialog id="credits-dialog" aria-labelledby="credits-title"><h2 id="credits-title">Créditos das rodadas</h2><div id="credits-content"></div><form method="dialog"><button>Fechar</button></form></dialog>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="identity-dialog" aria-labelledby="identity-title"><form id="identity-form"><h2 id="identity-title">Como podemos chamar você?</h2><p id="identity-description"></p><label for="player-name">Seu nome</label><input id="player-name" name="name" maxlength="24" autocomplete="nickname" required placeholder="Seu nome"><p id="identity-error" role="alert"></p><div class="actions"><button type="button" id="identity-cancel" class="secondary">Cancelar</button><button type="submit" id="identity-submit">Jogar</button></div></form></dialog>
  <dialog id="close-dialog"><form method="dialog"><h2>Encerrar esta sala?</h2><p>Todos sairão. Uma partida em andamento será cancelada sem vencedor.</p><div class="actions"><button value="cancel" class="secondary">Manter sala</button><button value="close" class="danger">Encerrar sala</button></div></form></dialog>
</body>
</html>
