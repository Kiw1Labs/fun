# Incluir no bloco http do Nginx ATIVO, nunca iniciar uma segunda instância.
map $http_upgrade $fun_connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $fun_image_sources {
    default "'self'";
    /godmode "'self' blob:";
    /nova-questao "'self' blob:";
}
server {
    listen 127.0.0.1:8082;
    server_name fun.kw1.com.br;
    if ($host != fun.kw1.com.br) { return 421; }
    client_max_body_size 4k;
    client_body_timeout 10s;
    access_log off;
    error_log stderr warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src $fun_image_sources; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    location = /api/question-submissions {
        client_max_body_size 768k;
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Host fun.kw1.com.br;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
    location /assets/ {
        alias /root/fun/current/dist/assets/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        alias /root/fun/shared/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { return 404; }
    location / {
        proxy_pass http://127.0.0.1:5050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $fun_connection_upgrade;
        proxy_set_header Host fun.kw1.com.br;
        # Não confiar no IP Cloudflare enquanto não houver real_ip confiável no Nginx ativo.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host "";
        proxy_read_timeout 60s;
        proxy_send_timeout 15s;
        proxy_buffering off;
    }
}
